<svg xmlns="http://www.w3.org/2000/svg" width="980" height="170" viewBox="0 0 980 170" role="img" aria-labelledby="title desc"><title id="title">Network capture flow</title><desc id="desc">Website tabs and extension workers send network events through Chrome DevTools Protocol to browser-network, which exposes them to Claude, Codex, and the terminal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l8 4-8 4z" fill="#333333"/></marker></defs><g fill="none" stroke="#333333" stroke-width="1.5"><rect x="10" y="22" width="190" height="48"/><rect x="10" y="100" width="190" height="48"/><rect x="270" y="61" width="190" height="48"/><rect x="515" y="61" width="190" height="48"/><rect x="760" y="61" width="210" height="48"/><path d="M200 46h30v39h36M200 124h30V85"/><path d="M460 85h51" marker-end="url(#arrow)"/><path d="M705 85h51" marker-end="url(#arrow)"/><path d="M230 85h36" marker-end="url(#arrow)"/></g><g fill="#171717" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle"><text x="105" y="52">Website tabs</text><text x="105" y="130">Extension workers</text><text x="365" y="91">Chrome DevTools</text><text x="610" y="91">browser-network</text><text x="865" y="91">Claude / Codex / shell</text></g></svg>
