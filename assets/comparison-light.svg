<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="486" viewBox="0 0 1100 486" role="img" aria-labelledby="title desc"><title id="title">Browser Network CLI comparison</title><desc id="desc">Browser Network CLI offers extension-worker capture, opt-in credentials and bodies, live queries, and replay by ID. Alternatives and sources are described in the usage guide.</desc><rect width="1100" height="486" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="24" y="32" fill="#656d76" font-size="16">Tool</text><text x="250" y="32" fill="#656d76" font-size="16">Network debugging workflow</text><rect x="1" y="50" width="1098" height="84" rx="6" fill="#f2f5f8"/><g transform="translate(85 66) scale(.65)"><path d="M23 9H9v62h14M57 9h14v62H57" fill="none" stroke="#1f2328" stroke-width="6"/><path d="M24 22h20v8H24zm10 14h22v8H34zM24 50h30v8H24z" fill="#1f2328"/></g><text x="250" y="83" fill="#1f2328" font-size="19" font-weight="650">Extension-worker capture. Credentials intact. Replay by ID.</text><text x="250" y="112" fill="#1f2328" font-size="17">Opt-in cookies, auth and bodies. Live queries. One CLI install.</text><path d="M0 204H1100" stroke="#d1d9e0"/><text x="24" y="174" fill="#656d76" font-size="17">agent-browser</text><text x="250" y="162" fill="#656d76" font-size="17">Browser automation with HAR export, including cookies and bodies.</text><text x="250" y="187" fill="#656d76" font-size="17">Extension-worker coverage is unverified here.</text><path d="M0 274H1100" stroke="#d1d9e0"/><text x="24" y="244" fill="#656d76" font-size="17">Chrome DevTools</text><text x="250" y="244" fill="#656d76" font-size="17">Page-oriented network tools through MCP or an experimental CLI.</text><path d="M0 344H1100" stroke="#d1d9e0"/><text x="24" y="314" fill="#656d76" font-size="17">REA</text><text x="250" y="302" fill="#656d76" font-size="17">Metadata and body shapes only. Cookies and authorization removed.</text><text x="250" y="327" fill="#656d76" font-size="17">Captured data alone cannot reproduce authenticated requests.</text><path d="M0 414H1100" stroke="#d1d9e0"/><text x="24" y="384" fill="#656d76" font-size="17">browser-harness-js</text><text x="250" y="384" fill="#656d76" font-size="17">CDP building blocks. You build the request store and replay workflow.</text><path d="M0 484H1100" stroke="#d1d9e0"/><text x="24" y="454" fill="#656d76" font-size="17">Claude / ChatGPT</text><text x="250" y="442" fill="#656d76" font-size="17">Network inspection inside their assistant integrations.</text><text x="250" y="467" fill="#656d76" font-size="17">Requires the corresponding extension and assistant setup.</text></g></svg>
